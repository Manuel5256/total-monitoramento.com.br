<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Total Monitoramento - Cadastro Técnico</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-header"><div class="logo-mini">🔧</div><h2>TOTAL MONITORAMENTO</h2><p style="opacity: 0.7; font-size: 12px;">Cadastro de Técnico</p></div>
        <div class="login-body">
            <form onsubmit="solicitarCadastroTecnico(event)">
                <div class="form-group"><label>Nome Completo</label><input type="text" id="nomeTecnico" required></div>
                <div class="form-group"><label>Senha</label><input type="password" id="senhaTecnico" required minlength="4"></div>
                <div class="form-group"><label>Confirmar Senha</label><input type="password" id="confirmarSenha" required minlength="4"></div>
                <div class="form-group"><label>Função</label><select id="funcaoTecnico" required><option value="">Selecione</option><option value="Técnico de CFTV">Técnico de CFTV</option><option value="Técnico de Alarmes">Técnico de Alarmes</option><option value="Técnico de Redes">Técnico de Redes</option><option value="Técnico Generalista">Técnico Generalista</option></select></div>
                <div style="background: rgba(255,152,0,0.1); padding: 15px; border-radius: 10px; margin-top: 20px;"><p style="font-size: 12px; color: var(--laranja); text-align: center;">⚠️ Operador precisa aprovar em até 1 minuto</p></div>
                <button type="submit" class="btn btn-primary" style="width: 100%; background: var(--laranja);">📝 Solicitar Cadastro</button>
            </form>
            <div class="link-area"><p>Já aprovado? <a href="login-tecnico.html">Login</a></p><p><a href="index.html">← Voltar</a></p></div>
        </div>
    </div>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-database-compat.js"></script>
    <script src="js/script.js"></script>
    <script>document.addEventListener('DOMContentLoaded',function(){const form=document.querySelector('form');const senha=document.getElementById('senhaTecnico');const confirmar=document.getElementById('confirmarSenha');form.addEventListener('submit',function(e){if(senha.value!==confirmar.value){e.preventDefault();alert('❌ Senhas não coincidem!');return false}return true})});</script>
</body>
</html>
