<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Total Monitoramento - Cadastro Cliente</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="logo-mini">👤</div>
            <h2>TOTAL MONITORAMENTO</h2>
            <p style="opacity: 0.7; font-size: 12px; letter-spacing: 2px; margin-top: 5px;">Cadastro de Cliente</p>
        </div>
        <div class="login-body">
            <form onsubmit="cadastrarCliente(event)">
                <div class="form-group"><label>Usuário</label><input type="text" id="usuarioCliente" required placeholder="Escolha um nome de usuário"></div>
                <div class="form-group"><label>Senha</label><input type="password" id="senhaCliente" required placeholder="Crie uma senha" minlength="4"></div>
                <div class="form-group"><label>Confirmar Senha</label><input type="password" id="confirmarSenha" required placeholder="Digite a senha novamente" minlength="4"></div>
                <div style="margin-top: 25px;"><button type="submit" class="btn btn-primary" style="width: 100%;">✅ Realizar Cadastro</button></div>
            </form>
            <div class="link-area">
                <p>Já possui cadastro? <a href="login-cliente.html">Faça login aqui</a></p>
                <p style="margin-top: 10px;"><a href="index.html">← Voltar ao início</a></p>
            </div>
        </div>
    </div>
    <footer style="text-align: center; padding: 20px; color: var(--cinza); font-size: 11px; margin-top: 20px;"><p>&copy; 2024 TOTAL MONITORAMENTO</p></footer>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-database-compat.js"></script>
    <script src="js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.querySelector('form');
            const senha = document.getElementById('senhaCliente');
            const confirmar = document.getElementById('confirmarSenha');
            form.addEventListener('submit', function(e) {
                if (senha.value !== confirmar.value) { e.preventDefault(); alert('❌ As senhas não coincidem!'); return false; }
                if (senha.value.length < 4) { e.preventDefault(); alert('❌ Senha mínima 4 caracteres!'); return false; }
                return true;
            });
        });
    </script>
</body>
</html>
