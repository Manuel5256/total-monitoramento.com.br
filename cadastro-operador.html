<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Total Monitoramento - Cadastro Operador</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-header"><div class="logo-mini">🖥️</div><h2>TOTAL MONITORAMENTO</h2><p style="opacity: 0.7; font-size: 12px; letter-spacing: 2px; margin-top: 5px;">Cadastro de Operador</p></div>
        <div class="login-body">
            <form onsubmit="cadastrarOperador(event)">
                <div class="form-group"><label>Nome Completo (Usuário)</label><input type="text" id="nomeOperador" required placeholder="Ex: Manuel Silva"></div>
                <div class="form-group"><label>Senha (4 dígitos)</label><input type="password" id="senhaOperador" required placeholder="4 dígitos" minlength="4" maxlength="4"></div>
                <div class="form-group"><label>Confirmar Senha</label><input type="password" id="confirmarSenha" required placeholder="Digite novamente" minlength="4" maxlength="4"></div>
                <div class="form-group"><label>Função</label><select id="funcaoOperador" required><option value="">Selecione</option><option value="Operador de Monitoramento">Operador de Monitoramento</option><option value="Supervisor de Monitoramento">Supervisor</option><option value="Coordenador de Plantão">Coordenador</option></select></div>
                <div class="form-group"><label>Turno</label><select id="turnoOperador" required><option value="">Selecione</option><option value="Diurno">🌞 Diurno (06h-18h)</option><option value="Noturno">🌙 Noturno (18h-06h)</option><option value="Administrativo">🏢 Administrativo</option></select></div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">✅ Realizar Cadastro</button>
            </form>
            <div class="link-area"><p>Já possui cadastro? <a href="login-operador.html">Faça login</a></p><p style="margin-top: 10px;"><a href="index.html">← Voltar</a></p></div>
        </div>
    </div>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-database-compat.js"></script>
    <script src="js/script.js"></script>
    <script>document.addEventListener('DOMContentLoaded',function(){const form=document.querySelector('form');const senha=document.getElementById('senhaOperador');const confirmar=document.getElementById('confirmarSenha');form.addEventListener('submit',function(e){if(senha.value!==confirmar.value){e.preventDefault();alert('❌ Senhas não coincidem!');return false}if(senha.value.length!==4){e.preventDefault();alert('❌ Senha deve ter 4 dígitos!');return false}return true})});</script>
</body>
</html>
