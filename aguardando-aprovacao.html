<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Total Monitoramento - Aguardando</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="welcome-container"><div class="welcome-card">
        <div class="welcome-logo">⏳</div>
        <h1 style="font-size: 1.5em;">AGUARDANDO <span style="color: var(--laranja);">APROVAÇÃO</span></h1>
        <p style="color: var(--cinza); margin: 20px 0;">Solicitação enviada ao operador de plantão.</p>
        <div class="timer-container"><p style="color: var(--cinza);">Tempo restante:</p><div class="timer-display" id="timerDisplay">60</div><p style="color: var(--cinza); font-size: 12px;">segundos</p></div>
        <div style="margin-top: 25px;"><div style="width: 100%; background: var(--preto-piano); border-radius: 10px; height: 8px;"><div id="progressBar" style="width: 100%; height: 100%; background: var(--laranja); transition: width 1s linear;"></div></div></div>
        <p id="statusMsg" style="color: var(--laranja); margin-top: 20px;">Aguardando operador...</p>
        <a href="index.html" style="color: var(--cinza); text-decoration: none; font-size: 12px;">← Cancelar</a>
    </div></div>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-database-compat.js"></script>
    <script src="js/script.js"></script>
    <script>let t=60;let i=setInterval(()=>{t--;document.getElementById('timerDisplay').textContent=t;document.getElementById('progressBar').style.width=(t/60*100)+'%';if(t<=0){clearInterval(i);document.getElementById('statusMsg').textContent='⏰ Tempo esgotado!';setTimeout(()=>{localStorage.setItem('tecnicoRejeitado','timeout');window.location.href='cadastro-rejeitado.html'},2000)}},1000);setInterval(()=>{if(localStorage.getItem('tecnicoAprovado')==='sim'){clearInterval(i);window.location.href='login-tecnico.html'}if(localStorage.getItem('tecnicoRejeitado')){clearInterval(i);window.location.href='cadastro-rejeitado.html'}},2000);</script>
</body>
</html>
