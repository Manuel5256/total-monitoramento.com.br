<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Total Monitoramento - Aguardando Aprovação</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="welcome-container">
        <div class="welcome-card">
            <div class="welcome-logo">⏳</div>
            <h1 style="font-size: 1.5em;">AGUARDANDO <span style="color: var(--laranja);">APROVAÇÃO</span></h1>
            <p style="color: var(--cinza); margin: 20px 0;">Sua solicitação foi enviada ao operador de plantão.</p>
            <div class="timer-container">
                <p style="color: var(--cinza);">Tempo restante:</p>
                <div class="timer-display" id="timerDisplay">60</div>
                <p style="color: var(--cinza); font-size: 12px;">segundos</p>
            </div>
            <div style="margin-top: 25px;"><div style="width: 100%; background: var(--preto-piano); border-radius: 10px; height: 8px;"><div id="progressBar" style="width: 100%; height: 100%; background: var(--laranja); transition: width 1s linear;"></div></div></div>
            <p id="statusMsg" style="color: var(--laranja); margin-top: 20px;">Aguardando operador...</p>
            <a href="index.html" style="color: var(--cinza); text-decoration: none; font-size: 12px;">← Cancelar</a>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-database-compat.js"></script>
    <script src="js/script.js"></script>
    
    <script>
        let tempoRestante = 60;
        let intervalo = setInterval(() => {
            tempoRestante--;
            document.getElementById('timerDisplay').textContent = tempoRestante;
            document.getElementById('progressBar').style.width = (tempoRestante / 60 * 100) + '%';
            
            if (tempoRestante <= 15) {
                document.getElementById('timerDisplay').style.color = 'var(--vermelho)';
                document.getElementById('progressBar').style.background = 'var(--vermelho)';
            }
            
            if (tempoRestante <= 0) {
                clearInterval(intervalo);
                document.getElementById('statusMsg').textContent = '⏰ Tempo esgotado!';
                document.getElementById('statusMsg').style.color = 'var(--vermelho)';
                database.ref('solicitacoes').update({ status: 'rejeitado' });
                setTimeout(() => window.location.href = 'cadastro-rejeitado.html', 2000);
            }
        }, 1000);
        
        // 🔥 ESCUTAR APROVAÇÃO VIA FIREBASE
        database.ref('solicitacoes').on('value', function(snapshot) {
            const solicitacao = snapshot.val();
            console.log('📡 Status da solicitação:', solicitacao);
            
            if (solicitacao && solicitacao.status === 'aprovado') {
                clearInterval(intervalo);
                document.getElementById('statusMsg').textContent = '✅ Aprovado! Redirecionando...';
                document.getElementById('statusMsg').style.color = 'var(--verde)';
                
                const tecnico = solicitacao;
                tecnico.status = 'aprovado';
                database.ref('tecnicos').push(tecnico).then(() => {
                    database.ref('solicitacoes').remove();
                    setTimeout(() => window.location.href = 'login-tecnico.html', 1500);
                });
            }
            
            if (solicitacao && solicitacao.status === 'rejeitado') {
                clearInterval(intervalo);
                database.ref('solicitacoes').remove();
                window.location.href = 'cadastro-rejeitado.html';
            }
        });
    </script>
</body>
</html>
