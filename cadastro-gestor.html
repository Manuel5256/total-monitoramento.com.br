<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Total Monitoramento - Cadastro Gestor</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="logo-mini">👔</div>
            <h2>TOTAL MONITORAMENTO</h2>
            <p style="opacity: 0.7; font-size: 12px; letter-spacing: 2px; margin-top: 5px;">Cadastro de Gestor</p>
        </div>
        <div class="login-body">
            <form onsubmit="cadastrarGestor(event)">
                <div class="form-group"><label>Nome Completo</label><input type="text" id="nomeGestor" required placeholder="Nome do gestor"></div>
                <div class="form-group"><label>Senha</label><input type="password" id="senhaGestor" required placeholder="Crie uma senha" minlength="4"></div>
                <div class="form-group"><label>Confirmar Senha</label><input type="password" id="confirmarSenha" required placeholder="Confirme a senha" minlength="4"></div>
                <div class="form-group"><label>Cargo</label><select id="cargoGestor" required><option value="">Selecione</option><option value="Gestor Geral">Gestor Geral</option><option value="Supervisor Técnico">Supervisor Técnico</option><option value="Coordenador">Coordenador</option></select></div>
                <button type="submit" class="btn btn-primary" style="width: 100%; background: var(--azul);">✅ Cadastrar Gestor</button>
            </form>
            <div class="link-area"><p>Já tem cadastro? <a href="login-gestor.html">Login</a></p><p><a href="index.html">← Voltar</a></p></div>
        </div>
    </div>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-database-compat.js"></script>
    <script src="js/script.js"></script>
    <script>document.addEventListener('DOMContentLoaded',function(){const form=document.querySelector('form');form.addEventListener('submit',function(e){const s=document.getElementById('senhaGestor');const c=document.getElementById('confirmarSenha');if(s.value!==c.value){e.preventDefault();alert('❌ Senhas não coincidem!');return false}return true})});</script>
</body>
</html>
