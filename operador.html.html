<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Total Monitoramento - Painel do Operador</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header-top"><div class="header-content"><div class="logo-area"><div class="logo-icon">📡</div><div class="logo-text"><h1>TOTAL <span>MONITORAMENTO</span></h1><p id="infoOperador">Painel do Operador</p></div></div><nav class="nav-menu"><a href="operador.html" class="active">🏠 Abrir O.S.</a><a href="#" onclick="mudarSecao('central')">📊 Central</a><a href="#" onclick="mudarSecao('tecnicos')">👨‍🔧 Técnicos</a><a href="#" onclick="logout()">🚪 Sair</a></nav></div></header>
    <div class="main-container">
        <div style="background: var(--preto-claro); padding: 20px; border-radius: 12px; margin-bottom: 25px; border: 1px solid var(--amarelo); display: flex; justify-content: space-between; align-items: center;"><div><strong style="color: var(--amarelo);" id="nomeOperadorDisplay"></strong> | <span id="funcaoOperadorDisplay"></span> | <span id="turnoOperadorDisplay"></span></div><button class="btn btn-danger btn-sm" onclick="logout()">🚪 Sair</button></div>
        <div class="stats-grid"><div class="stat-card" style="border-left-color: var(--amarelo);"><div class="stat-numero" id="countAbertas">0</div><div class="stat-label">🆕 OS Abertas</div></div><div class="stat-card" style="border-left-color: var(--laranja);"><div class="stat-numero" id="countAndamento">0</div><div class="stat-label">⏳ Em Andamento</div></div><div class="stat-card" style="border-left-color: var(--verde);"><div class="stat-numero" id="countResolvidas">0</div><div class="stat-label">✅ Resolvidas</div></div><div class="stat-card" style="border-left-color: var(--azul);"><div class="stat-numero" id="countTecnicos">0</div><div class="stat-label">👨‍🔧 Técnicos</div></div></div>
        <div id="secao-abrir-os" class="card"><div class="card-header"><div class="icon">📋</div><h2>Abrir Ordem de Serviço</h2></div>
            <form id="formOS" onsubmit="cadastrarOSOperador(event)">
                <div class="form-group"><label>Nome do Cliente</label><input type="text" id="nomeCliente" required></div>
                <div class="form-group"><label>Tipo de Serviço</label><select id="tipoServico" required><option value="">Selecione</option><option value="Instalação de Câmeras">Instalação de Câmeras</option><option value="Manutenção de CFTV">Manutenção de CFTV</option><option value="Alarme Monitorado">Alarme Monitorado</option><option value="Controle de Acesso">Controle de Acesso</option><option value="Cerca Elétrica">Cerca Elétrica</option><option value="Suporte Técnico">Suporte Técnico</option></select></div>
                <div class="form-group"><label>Prioridade</label><select id="prioridade" required><option value="Baixa">Baixa</option><option value="Média" selected>Média</option><option value="Alta">Alta</option><option value="Urgente">Urgente</option></select></div>
                <div class="form-group"><label>Descrição</label><textarea id="descricaoServico" rows="4" required></textarea></div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">📝 Abrir O.S.</button>
            </form>
        </div>
        <div id="secao-central" class="card" style="display: none;"><div class="card-header"><div class="icon">📊</div><h2>Central</h2></div><div class="table-container"><table><thead><tr><th>Protocolo</th><th>Cliente</th><th>Serviço</th><th>Prioridade</th><th>Status</th><th>Técnico</th><th>Ações</th></tr></thead><tbody id="corpoCentral"></tbody></table></div></div>
        <div id="secao-tecnicos" class="card" style="display: none;"><div class="card-header"><div class="icon">👨‍🔧</div><h2>Técnicos</h2></div><div class="table-container"><table><thead><tr><th>Nome</th><th>Função</th><th>Status</th></tr></thead><tbody id="corpoTecnicos"></tbody></table></div></div>
    </div>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-database-compat.js"></script>
    <script src="js/script.js"></script>
    <script>let secaoAtual='abrir-os';function mudarSecao(s){secaoAtual=s;document.getElementById('secao-abrir-os').style.display=s==='abrir-os'?'block':'none';document.getElementById('secao-central').style.display=s==='central'?'block':'none';document.getElementById('secao-tecnicos').style.display=s==='tecnicos'?'block':'none';if(s==='central')carregarCentralOperador();if(s==='tecnicos')carregarTecnicosOperador()}document.addEventListener('DOMContentLoaded',function(){const op=verificarLogin('operadorLogado');if(!op)return;document.getElementById('nomeOperadorDisplay').textContent=op.nome;document.getElementById('funcaoOperadorDisplay').textContent=op.funcao;document.getElementById('turnoOperadorDisplay').textContent=op.turno;atualizarStatsOperador();setInterval(verificarSolicitacaoTecnico,5000)});</script>
</body>
</html>
